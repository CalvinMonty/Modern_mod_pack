# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.249
loader_version_range=[1,)

## Mod Properties
mod_id=modern_mod_pack
mod_name=Modern Mod Pack
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.calvinmonty.modernmodpack
mod_authors=CalvinMonty
mod_description=A Minecraft NeoForge mod that can be installed and published through CurseForge.
mod_display_url=https://github.com/CalvinMonty/Modern_mod_pack
mod_issue_tracker_url=https://github.com/CalvinMonty/Modern_mod_pack/issues

# Numeric CurseForge project ID from the project page (not the slug).
# Leave empty until the CurseForge project exists, then run publishCurseForge.
curseforge_project_id=
