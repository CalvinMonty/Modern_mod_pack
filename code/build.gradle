import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'net.darkhax.curseforgegradle' version '1.1.26'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def packWorkspaceAssets = tasks.register('packWorkspaceAssets', Copy) {
    from(rootProject.file('../assets')) {
        exclude 'README.md'
        exclude '**/.gitkeep'
    }
    into layout.buildDirectory.dir('generated/workspaceAssets/assets')
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/'), '--existing', file('../assets')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir layout.buildDirectory.dir('generated/workspaceAssets')
}

repositories {
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn packWorkspaceAssets
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_display_url        : mod_display_url,
            mod_issue_tracker_url  : mod_issue_tracker_url
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    onlyIf {
        def token = System.getenv('CURSEFORGE_TOKEN')
        def projectId = findProperty('curseforge_project_id')
        token && projectId && projectId.toString().trim()
    }
    dependsOn jar, reobfJar
    apiToken = System.getenv('CURSEFORGE_TOKEN') ?: ''
    def projectId = findProperty('curseforge_project_id')
    if (projectId && projectId.toString().trim()) {
        def mainFile = upload(projectId.toString().trim(), jar)
        mainFile.changelog = 'Initial CurseForge-compatible Forge 1.20.1 build.'
        mainFile.releaseType = 'alpha'
        mainFile.addModLoader('Forge')
        mainFile.addGameVersion(minecraft_version)
        mainFile.addJavaVersion('Java 17')
    }
}
