import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'net.darkhax.curseforgegradle' version '1.3.33'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

def packWorkspaceAssets = tasks.register('packWorkspaceAssets', Copy) {
    from(rootProject.file('../assets')) {
        exclude 'README.md'
        exclude '**/.gitkeep'
    }
    into layout.buildDirectory.dir('generated/workspaceAssets/assets')
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    srcDir(layout.buildDirectory.dir('generated/workspaceAssets'))
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn packWorkspaceAssets
}

repositories {
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing', file('../assets').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_display_url        : mod_display_url,
            mod_issue_tracker_url  : mod_issue_tracker_url
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    onlyIf {
        def token = System.getenv('CURSEFORGE_TOKEN')
        def projectId = findProperty('curseforge_project_id')
        token && projectId && projectId.toString().trim()
    }
    dependsOn jar
    apiToken = System.getenv('CURSEFORGE_TOKEN') ?: ''
    def projectId = findProperty('curseforge_project_id')
    if (projectId && projectId.toString().trim()) {
        def mainFile = upload(projectId.toString().trim(), jar)
        mainFile.changelog = 'Initial CurseForge-compatible NeoForge build.'
        mainFile.releaseType = 'alpha'
        mainFile.addModLoader('NeoForge')
        mainFile.addGameVersion(minecraft_version)
        mainFile.addEnvironment('Client', 'Server')
    }
}
